#
# Privasys Wallet — Full CI/CD pipeline
#
# Builds the Rust native RA-TLS library for iOS & Android,
# then builds the Expo app with EAS Build (cloud) or locally
# on GitHub Actions macOS runners.
#
# Triggers:
#   - Push to main (full build + deploy)
#   - Pull requests (type-check + lint only)
#   - Manual dispatch (choose platform + profile)

name: Build Wallet

on:
  push:
    tags:
      - 'wallet-v*'
    # A build on main when what the native build depends on changes, which
    # submits nothing: it fills the build caches. GitHub shares a cache only
    # with the ref that saved it and the default branch, so a release, built
    # from its own tag, can read only what main saved. (Path filters do not
    # apply to the tag pushes above.)
    branches:
      - main
    paths:
      - 'wallet/bun.lock'
      - 'wallet/app.config.ts'
      - 'wallet/eas.json'
      - 'wallet/modules/**'
      - '.github/workflows/build-wallet.yaml'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options: [ios, android, all]
      profile:
        description: 'EAS build profile'
        required: true
        default: 'development'
        type: choice
        options: [development, preview, staging, production]
      use_eas_cloud:
        description: 'Use EAS Cloud Build (vs local GitHub Actions runner)'
        required: true
        default: true
        type: boolean
      ios_runner:
        description: 'macOS image for the iOS build: xcode-27 (Xcode 27, the release default) or macos-26 (Xcode 26)'
        required: false
        default: 'xcode-27'
        type: choice
        options: [macos-26, xcode-27]
      xcode:
        description: 'Xcode on that image: default (the image''s own), latest (its newest release, betas skipped), or a version such as 27.2'
        required: false
        default: '27.2'
        type: string
      submit:
        description: 'Submit to TestFlight and Play internal (off for a trial build)'
        required: false
        default: true
        type: boolean

env:
  RUST_TOOLCHAIN: stable
  NODE_VERSION: '24'
  BUN_VERSION: '1.3.11'
  # Auth for the @privasys scoped registry (wallet/.npmrc) so `bun install`
  # can resolve @privasys/drive-sdk from GitHub Packages. The default
  # GITHUB_TOKEN can read the org's (public) packages.
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Pre-built Rust RA-TLS FFI libraries are downloaded from this release of
  # https://github.com/Privasys/ra-tls-clients instead of being recompiled
  # on every wallet build. Bump when ra-tls-clients ships a new version.
  # v0.4.3 advertises [privasys-ratls/1, http/1.1] only — h2 was dropped
  # in v0.4.3 because both clients speak HTTP/1.1 only (Rust uses ureq,
  # Go writes HTTP/1.1 manually) and Caddy preferred h2 → connection
  # closed mid-request on /__privasys/session-bootstrap (wallet 1.2.16).
  # v0.4.9 adds the generic ratls_request FFI (arbitrary HTTP methods) the
  # Android native module + the Drive sealed-transport fetch link against.
  # v0.5.0 REQUIRES the TLS channel binder in challenge mode (folds the
  # session channel binder into report_data — mitigates attestation relay/
  # replay). The C FFI signature is unchanged (the binder is obtained from the
  # client's own handshake key schedule internally), so no wallet code changes.
  # A wallet on v0.5.0+ rejects any enclave/vault that does not yet emit the
  # binder, so it MUST ship alongside the coordinated enclave + vault rollout.
  # v0.6.0 bumps the rustls fork to privasys-v0.8.0 (mutual channel binding —
  # completes the client leg of mutual RA-TLS); mobile FFI unchanged, pin only.
  # v0.7.0 (rustls privasys-v0.8.1) adds two FFI features the wallet's
  # verification UX needs: typed verify errors ({ error, kind }) so the app can
  # tell an unreachable attestation service from a bad quote, and a deterministic
  # report_data binding check on every ratls_request/ratls_post (the data plane
  # is no longer blind to a swapped certificate). It also re-pins the live
  # rustls tag (v0.8.0 was deleted in the rebase), so it is source-reproducible.
  # v0.7.1 fixes a v0.7.0 regression: the data-plane check must pass certs with
  # no RA-TLS quote (non-enclave backends — the portal / IdP FIDO2 host, plain
  # FIDO2 relying parties), only enforcing the binding when a quote is present.
  # v0.7.2 adds OID 3.6 (workload app id) + 6.1 (dependency set) to the client's
  # known-OID set, so custom_oids surfaces the Drive enclave's app id (the leaf
  # already carried it; the older client silently dropped it).
  # v0.7.3 fixes cert inspection on confidential-GPU enclaves (tdx-gpu, e.g.
  # confidential-ai): the leaf carries BOTH a TDX quote and NVIDIA GPU evidence
  # (OID 5.1), and the last-wins extension walk let the opaque GPU evidence
  # overwrite the TDX quote — stripping mrtd, so the wallet's session-relay
  # gate reported "did not present an attested certificate". The TEE quote now
  # wins regardless of extension order. REQUIRED for chat/Drive sealed sessions
  # against any GPU-CC enclave.
  # v0.7.4 stamps DT_SONAME on the Android libratls_mobile.so. The Rust cdylib
  # had no soname, so the NDK baked the absolute build path into libratls_jni's
  # DT_NEEDED and the on-device loader failed (UnsatisfiedLinkError) — ALL RA-TLS
  # attestation was broken on Android (Drive, ID Check, sign-in). iOS was fine
  # (static .a, no runtime lookup). Android-only; iOS binary is byte-identical.
  # v0.7.5 surfaces TDX RTMR1/RTMR2 in the AttestationResult so the wallet can
  # persist + diff the FULL platform-runtime fingerprint the session-relay
  # enc_pub is pinned to (mgmt hashes MRTD|RTMR1|RTMR2). Without it a platform
  # roll that moves only the RTMRs (kernel/initrd) rotates the sealed session
  # silently; with it, that rotation surfaces as a "platform upgraded, re-approve"
  # ceremony. Additive JSON fields; iOS + Android both rebuilt.
  # v0.7.6 decodes chunked transfer coding in the HTTP response parser. The
  # client read bodies from Content-Length alone; Go's http server chunks any
  # response over its 2 KiB buffer, so bigger bodies (the first was Drive's
  # ~2.1 KiB root listing) arrived as status 200 with an EMPTY body — the
  # "empty Drive tab" bug. Affects every RA-TLS response over ~2 KiB.
  # v0.7.7 surfaces EVERY extension under the Privasys arc in custom_oids
  # (membership by arc, not a fixed allowlist). The 3.5.* sub-arc is
  # app-published at runtime, so the exact-match allowlist silently dropped
  # exactly those — the attestation view now sees app extensions.
  # v0.9.1: the RA-TLS v2 client, with trust selection.
  #
  # v0.9.0 was pinned briefly and broke every call to privasys.id. v0.7.7 with
  # no CA file used NoCertVerifier, so the chain was never checked and
  # attestation did the work; v0.9.0 verified against a RootCertStore holding
  # ONLY the embedded Privasys intermediate CAs. privasys.id serves an ordinary
  # public certificate and does not chain to them, so every FIDO2 call failed
  # with "invalid peer certificate: UnknownIssuer" in 48ms. 1.3.94 could not
  # sign in at all.
  #
  # v0.9.1 adds trust selection (auto | fleet | public), and the wallet now asks
  # for it explicitly rather than relying on the automatic fallback: the IdP is
  # reached with {"attestation":"none","trust":"public"} because it is not an
  # enclave and will never present a Privasys-CA certificate. Enclave hosts keep
  # the attested path.
  #
  # This pin needs a back-end that speaks v2. Moving it ahead of one is what
  # produced the failure above, and nothing in the build catches that: it looks
  # like a successful build right up until a human tries to sign in.
  # v0.15.0 adds ratls_request_bytes: the response body as raw bytes, so a
  # file read over RA-TLS (a PDF, an image) arrives intact (the string calls
  # carry the body inside a JSON string). Also brings v0.10-v0.14: platform
  # identity read from the quote, an optional platform allow-list on the
  # policy, a failed re-attestation closing the connection.
  # v0.15.2 is the same code built for iOS 16 and later: before it the
  # library's C and assembly were built for the SDK's own iOS version, newer
  # than the wallet's deployment target.
  RATLS_VERSION: v0.15.2

jobs:
  # ─── Type-check & lint (runs on all PRs) ──────────────────────────
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        working-directory: wallet
        run: bun install --frozen-lockfile
      - name: Type-check
        working-directory: wallet
        run: bunx tsc --noEmit
      # The wallet bundles its own copy of the canonical referential (EAS builds
      # see only the wallet directory), kept current by a manual `sync-shared`.
      # Re-run it here so a forgotten sync fails the build instead of shipping a
      # wallet that requests attributes the IdP does not know.
      - name: Re-sync the shared referential
        working-directory: wallet
        run: bun run sync-shared
      - name: Fail if the bundled copy was stale
        run: git diff --exit-code -- wallet/src/shared
      # The whole suite. This step once ran the referential tests alone, because
      # two suites could not load at the time; they have long since been fixed,
      # and the narrow run then let four suites sit broken for two weeks
      # (2026-10-27 to 2026-11-10) with every release green.
      - name: Test
        working-directory: wallet
        run: bunx jest --ci --watchAll=false
      # The entitlements that reach the binary, not the ones app.config.ts
      # declares. A config plugin ASSIGNING keychain-access-groups instead of
      # merging silently dropped the legacy App ID prefix groups after the Apple
      # account transfer, and nothing failed: the config read correctly, the
      # build succeeded, and the first symptom would have been users opening an
      # empty wallet on a phone that had one.
      - name: Check iOS entitlements
        working-directory: wallet
        run: node scripts/check-ios-entitlements.mjs

      - name: Type-check SDK
        working-directory: sdk
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit

  # ─── Build Rust RA-TLS native libraries ───────────────────────────
  # Removed: pre-built artefacts are now consumed directly from
  # https://github.com/Privasys/ra-tls-clients releases (env.RATLS_VERSION).
  # See the "Download Rust ... artefacts" step inside build-local-ios /
  # build-local-android below.

  # ─── Build app via EAS Cloud ──────────────────────────────────────
  # NOTE: EAS Cloud builds clone from git, so pre-built Rust binaries
  # must be committed to the repo for this path to work. Use local
  # builds (below) when Rust artifacts are provided by prior CI steps.
  build-eas-cloud:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.use_eas_cloud
    needs: [check]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ${{ inputs.platform == 'all' && fromJSON('["ios", "android"]') || fromJSON(format('["{0}"]', inputs.platform)) }}
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        working-directory: wallet
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build with EAS Cloud
        working-directory: wallet
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --no-wait

  # ─── Build app locally on GitHub Actions runner ───────────────────
  # Uses pre-built Rust artifacts from prior jobs. This is the default
  # path for push-to-main and for manual dispatch without EAS Cloud.
  build-local-ios:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       !inputs.use_eas_cloud &&
       (inputs.platform == 'ios' || inputs.platform == 'all'))
    needs: [check]
    # Xcode 26 (iOS 26 SDK) for releases. A manual run can try the xcode-27
    # preview image: Apple wants the iOS 27 SDK from April 2027 (ITMS-90725).
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.ios_runner || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v6

      # Releases and main builds keep the image's default Xcode; a manual run
      # can pick another one the image carries.
      - name: Select Xcode
        env:
          XCODE: ${{ github.event_name == 'workflow_dispatch' && inputs.xcode || '27.2' }}
        run: |
          set -euo pipefail
          app=""
          case "$XCODE" in
            default|"") ;;
            latest)
              app=$(ls -d /Applications/Xcode_*.app | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' | sort -V | tail -1) ;;
            *)
              app="/Applications/Xcode_$XCODE.app"
              if [ ! -d "$app" ]; then
                echo "::error::Xcode $XCODE is not on this image. It has:"
                ls -d /Applications/Xcode_*.app
                exit 1
              fi ;;
          esac
          if [ -n "$app" ]; then
            sudo xcode-select -s "$app/Contents/Developer"
            echo "DEVELOPER_DIR=$app/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download Rust iOS artefacts from ra-tls-clients release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wallet/modules/native-ratls/ios/lib
          cd wallet/modules/native-ratls/ios/lib
          gh release download "$RATLS_VERSION" \
            --repo Privasys/ra-tls-clients \
            --pattern 'ratls-mobile-ios.tar.gz' \
            --output ratls-mobile-ios.tar.gz
          tar -xzf ratls-mobile-ios.tar.gz
          rm ratls-mobile-ios.tar.gz
          ls -la
          test -f libratls_mobile.a

      - name: Stage artefacts for EAS tarball
        run: |
          # Force-track and commit so the EAS source tarball includes them
          # (gitignored files are excluded from the EAS archive)
          git add -f wallet/modules/native-ratls/ios/lib/
          git -c user.name='CI' -c user.email='ci@privasys.org' commit -m 'ci: add Rust iOS artifacts [skip ci]'

      # Build caches: compiled C++ (ccache, on through ios.ccacheEnabled in
      # app.config.ts, with React Native's recommended settings for Xcode), the
      # pods and the packages. EAS builds in a fixed folder, so paths, and so
      # cache entries, match from one build to the next.
      - name: Set up ccache
        run: |
          brew install ccache
          {
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_INODECACHE=true"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ~/Library/Caches/CocoaPods
            ~/.bun/install/cache
          key: wallet-ios-device-${{ hashFiles('wallet/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            wallet-ios-device-${{ hashFiles('wallet/bun.lock') }}-
            wallet-ios-device-

      - name: Install dependencies
        working-directory: wallet
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Build iOS locally
        working-directory: wallet
        env:
          EXPO_PUBLIC_OAUTH_GOOGLE_CLIENT_ID_IOS: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID_IOS }}
          EXPO_PUBLIC_OAUTH_MICROSOFT_CLIENT_ID: ${{ secrets.OAUTH_MICROSOFT_CLIENT_ID }}
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output build/wallet-ios.ipa
          ccache -s

      - name: Upload IPA
        # Not for a cache-filling build on main.
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: wallet-ios-${{ inputs.profile || 'production' }}
          path: wallet/build/wallet-ios.ipa
          retention-days: 30

  build-local-android:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       !inputs.use_eas_cloud &&
       (inputs.platform == 'android' || inputs.platform == 'all'))
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Rust Android artefacts from ra-tls-clients release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wallet/modules/native-ratls/android/src/main/jniLibs
          cd wallet/modules/native-ratls/android/src/main/jniLibs
          gh release download "$RATLS_VERSION" \
            --repo Privasys/ra-tls-clients \
            --pattern 'ratls-mobile-android.tar.gz' \
            --output ratls-mobile-android.tar.gz
          tar -xzf ratls-mobile-android.tar.gz
          rm ratls-mobile-android.tar.gz
          echo "=== jniLibs contents ==="
          find . -type f
          test -f arm64-v8a/libratls_mobile.so
          test -f x86_64/libratls_mobile.so

      - name: Stage artefacts for EAS tarball
        run: |
          # Force-track and commit so the EAS source tarball includes them
          # (gitignored files are excluded from the EAS archive)
          git add -f wallet/modules/native-ratls/android/src/main/jniLibs/
          git -c user.name='CI' -c user.email='ci@privasys.org' commit -m 'ci: add Rust Android artifacts [skip ci]'

      # Build caches: Gradle's downloads and build cache, compiled C++ (React
      # Native's CMake uses ccache when it is installed) and the packages. EAS
      # builds in a fixed folder, so paths, and so cache entries, match.
      - uses: gradle/actions/setup-gradle@v6

      - name: Set up ccache and Gradle's build cache
        run: |
          sudo apt-get install -y -qq ccache
          # The user-level file wins over the project's, whose 2 GB heap ran
          # out packaging the APK on Ubuntu 26.04 runners (OutOfMemoryError in
          # :app:packageRelease). The runner has 16 GB.
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          {
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ~/.bun/install/cache
          key: wallet-android-release-${{ hashFiles('wallet/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            wallet-android-release-${{ hashFiles('wallet/bun.lock') }}-
            wallet-android-release-

      - name: Install dependencies
        working-directory: wallet
        run: bun install --frozen-lockfile

      # The runner image has neither NDK the build asks for, and Gradle
      # downloads them mid-build with no retry: one truncated download of
      # 27.0 ("Archive is not a ZIP archive") failed 1.4.67's Android build.
      # Installed here, a bad download is retried before the build starts.
      - name: Install the NDKs
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for ndk in 27.1.12297006 27.0.12077973; do
            for attempt in 1 2 3; do
              if [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ]; then break; fi
              rm -rf "$ANDROID_HOME/ndk/$ndk"
              yes | "$SDKM" --install "ndk;$ndk" > /dev/null || echo "NDK $ndk: attempt $attempt failed"
            done
            test -f "$ANDROID_HOME/ndk/$ndk/source.properties" || { echo "::error::NDK $ndk did not install"; exit 1; }
          done

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android locally
        working-directory: wallet
        env:
          EXPO_PUBLIC_OAUTH_GOOGLE_CLIENT_ID_ANDROID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID_ANDROID }}
          EXPO_PUBLIC_OAUTH_MICROSOFT_CLIENT_ID: ${{ secrets.OAUTH_MICROSOFT_CLIENT_ID }}
        run: |
          PROFILE="${{ inputs.profile || 'production' }}"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --local \
            --non-interactive \
            --output build/wallet-android.aab
          ccache -s

      - name: Upload AAB
        # Not for a cache-filling build on main.
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: wallet-android-${{ inputs.profile || 'production' }}
          path: wallet/build/wallet-android.aab
          retention-days: 30

  # ─── Submit to TestFlight ─────────────────────────────────────────
  submit-testflight:
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/wallet-v')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.submit &&
       !inputs.use_eas_cloud &&
       (inputs.platform == 'ios' || inputs.platform == 'all'))
    needs: [build-local-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download IPA
        uses: actions/download-artifact@v8
        with:
          name: wallet-ios-${{ inputs.profile || 'production' }}
          path: wallet/build/

      - name: Install dependencies
        working-directory: wallet
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write App Store Connect API Key
        run: |
          mkdir -p keys
          echo "${{ secrets.ASC_API_KEY_P8_BASE64 }}" | base64 -d > keys/AuthKey_LK6XPT3RK2.p8

      - name: Submit to TestFlight
        working-directory: wallet
        run: |
          eas submit \
            --platform ios \
            --path build/wallet-ios.ipa \
            --non-interactive

  # ─── Submit to Google Play ────────────────────────────────────────
  # Runs on:
  #   - tag push (wallet-v*) — always treated as a production release
  #   - manual dispatch with profile=production and android in scope
  submit-google-play:
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/wallet-v')) ||
      (github.event_name == 'workflow_dispatch' &&
       inputs.submit &&
       !inputs.use_eas_cloud &&
       (inputs.platform == 'android' || inputs.platform == 'all') &&
       inputs.profile == 'production')
    needs: [build-local-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: wallet-android-${{ inputs.profile || 'production' }}
          path: wallet/build/

      - name: Install dependencies
        working-directory: wallet
        run: bun install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Google Play service account key
        run: echo "$GOOGLE_PLAY_KEY" > wallet/google-play-key.json
        env:
          GOOGLE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}

      - name: Submit to Google Play
        working-directory: wallet
        run: |
          eas submit \
            --platform android \
            --path build/wallet-android.aab \
            --non-interactive
