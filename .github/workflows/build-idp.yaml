name: Build & Push IdP

on:
  push:
    tags:
      - 'idp-v*'

permissions:
  contents: read
  packages: write

jobs:
  # The IdP embeds a COPY of shared/canonical-attributes.json (Go's embed cannot
  # reach outside the package) and the Dockerfile never re-generates it, so
  # whatever is committed is what ships. That copy once shipped eleven
  # attributes stale. Gate the release on the copy being reproducible from the
  # source rather than trusting the generate step to be remembered.
  referential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: idp/go.mod
      - name: Regenerate the embedded referential
        working-directory: idp
        run: go generate ./...
      - name: Fail if the embedded copy was stale
        run: git diff --exit-code -- idp/internal/attributes
      - name: Test
        working-directory: idp
        # The WHOLE suite, not just the referential. Until 2026-09-07 this ran
        # ./internal/attributes/... alone, so the sqlite-backed tests in
        # clients, oidc, recovery and store never ran anywhere: they needed cgo,
        # and nobody noticed they were dead.
        #
        # CGO_ENABLED=0 deliberately, so CI exercises the same cgo-free driver a
        # developer gets without a C toolchain. The image still ships
        # mattn/go-sqlite3: the Dockerfile builds with CGO_ENABLED=1.
        env:
          CGO_ENABLED: 0
        run: go test ./...

  build-and-push:
    needs: [referential]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: meta
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#idp-}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: idp
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/privasys/idp:${{ steps.meta.outputs.version }}
            ghcr.io/privasys/idp:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Privasys/identity-platform
            org.opencontainers.image.description=Privasys IdP — OIDC + FIDO2 authorization server
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Print image digest
        run: |
          echo "Image pushed:"
          echo "  ghcr.io/privasys/idp:${{ steps.meta.outputs.version }}"
          echo "  ghcr.io/privasys/idp:latest"
