# A fresh launch of the demo wallet, waited on until Profile is drawn and the
# logo has opened onto it (components/AppLock).
appId: org.privasys.wallet.demo
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible:
      id: "profile-screen"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
