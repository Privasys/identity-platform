#
# Wallet screenshots: builds the demo wallet (EAS profile `demo`, invented
# holder, no network; wallet/src/services/demo) once for the iOS simulator and
# once for the Android emulator, then runs the Maestro flows in wallet/maestro
# on every device asked for, in parallel, and uploads one set of screenshots
# per device. Manual only: nothing here is shipped or submitted.
#
# The defaults cover the store listings: a large phone and a tablet on each
# platform, and an Android foldable. A device the runner's Xcode does not know
# fails its own job only, listing the simulators the runner has; the other
# devices still deliver.
#
# The iPhone Duo is not a default. Its simulator needs Xcode 27.1, which only
# the `xcode-27` image has (a public preview, actions/runner-images#14404), so
# its job runs there, unfolded by .github/tools/duo-hinge. But Maestro, like
# XCUIScreen.main, sees only the cover display: unfolded, the cover goes black
# and the app is on the inner display, so the flows find nothing (2026-11-18,
# run 44329163720; mobile-dev-inc/maestro#3617). And the app is still built
# with Xcode 26, which the Duo shows as an app for an older iOS. Pass it in
# ios_devices once Maestro drives the inner display and the wallet is built
# with Xcode 27.

name: Wallet screenshots

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        default: 'all'
        type: choice
        options: [ios, android, all]
      ios_devices:
        description: 'iOS simulators, a JSON list of device type names (`xcrun simctl list devicetypes`)'
        required: true
        default: '["iPhone 17 Pro Max", "iPad Pro 13-inch (M5)"]'
      android_profiles:
        description: 'Android emulator profiles, a JSON list of avdmanager device ids'
        required: true
        default: '["pixel_9_pro_xl", "pixel_tablet", "pixel_fold"]'
      android_fold:
        description: 'Foldable emulators: shoot the inner screen (unfolded) or the outer screen (folded)'
        required: true
        default: 'unfolded'
        type: choice
        options: [unfolded, folded]
      locale:
        description: 'Device language (BCP 47, e.g. en-GB, fr-FR)'
        required: true
        default: 'en-GB'

env:
  BUN_VERSION: '1.3.11'
  # Auth for the @privasys scoped registry (wallet/.npmrc), as in build-wallet.
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RATLS_VERSION: v0.15.1
  MAESTRO_VERSION: '1.39.13'
  # The iOS driver (an XCTest runner) can take minutes to start on a cold
  # simulator; its default wait gave up on the iPad.
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'

jobs:
  ios-build:
    if: inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # The demo app as last built from exactly this wallet: a rerun, or a
      # change to the Maestro flows only, skips the build.
      - name: Reuse an unchanged build
        id: built
        uses: actions/cache@v6
        with:
          path: wallet/build/demo-ios.tar.gz
          key: demo-ios-app-${{ env.RATLS_VERSION }}-${{ hashFiles('wallet/**', '!wallet/maestro/**') }}

      - uses: oven-sh/setup-bun@v2
        if: steps.built.outputs.cache-hit != 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: RA-TLS libraries (device and simulator)
        if: steps.built.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wallet/modules/native-ratls/ios/lib
          cd wallet/modules/native-ratls/ios/lib
          gh release download "$RATLS_VERSION" --repo Privasys/ra-tls-clients \
            --pattern 'ratls-mobile-ios.tar.gz' --output ratls-mobile-ios.tar.gz
          tar -xzf ratls-mobile-ios.tar.gz && rm ratls-mobile-ios.tar.gz
          test -f libratls_mobile-simulator.a

      - name: Stage artefacts for the EAS tarball
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          git add -f wallet/modules/native-ratls/ios/lib/
          git -c user.name='CI' -c user.email='ci@privasys.org' commit -m 'ci: add Rust iOS artifacts [skip ci]'

      # Build caches, as in build-wallet: compiled C++ (ccache), the pods and
      # the packages, with EAS building in a fixed folder so entries match.
      - name: Set up ccache
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          brew install ccache
          {
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_MAXSIZE=2G"
            echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros"
            echo "CCACHE_FILECLONE=true"
            echo "CCACHE_DEPEND=true"
            echo "CCACHE_INODECACHE=true"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.ccache
            ~/Library/Caches/CocoaPods
            ~/.bun/install/cache
          key: wallet-ios-sim-${{ hashFiles('wallet/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            wallet-ios-sim-${{ hashFiles('wallet/bun.lock') }}-
            wallet-ios-sim-

      - name: Install dependencies
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: wallet
        run: bun install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        if: steps.built.outputs.cache-hit != 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install CocoaPods
        if: steps.built.outputs.cache-hit != 'true'
        run: sudo gem install cocoapods

      - name: Build the demo app for the simulator
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: wallet
        run: |
          eas build --platform ios --profile demo --local --non-interactive --output build/demo-ios.tar.gz
          ls -la build/demo-ios.tar.gz
          ccache -s

      - uses: actions/upload-artifact@v7
        with:
          name: demo-ios-app
          path: wallet/build/demo-ios.tar.gz
          retention-days: 3

  ios:
    needs: ios-build
    # Devices that need Xcode 27 run on its image; the rest on macos-26.
    runs-on: ${{ matrix.device == 'iPhone Duo' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON(inputs.ios_devices) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: demo-ios-app
          path: wallet/build

      - name: Boot the simulator
        timeout-minutes: 15
        env:
          DEVICE: ${{ matrix.device }}
          LANG_CODE: ${{ inputs.locale }}
        run: |
          set -euo pipefail
          mkdir -p wallet/build/app && tar -xzf wallet/build/demo-ios.tar.gz -C wallet/build/app
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, os, sys
          name = os.environ['DEVICE']
          devs = [d for r in json.load(sys.stdin)['devices'].values() for d in r if d['name'] == name]
          print(devs[0]['udid'] if devs else '')")
          if [ -z "$UDID" ]; then
            # No simulator of that name yet: make one, if the runner's Xcode
            # knows the device type and has a runtime for it.
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c "
          import json, os, sys
          name = os.environ['DEVICE']
          t = [d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name'] == name]
          print(t[0] if t else '')")
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c "
          import json, sys
          r = [x['identifier'] for x in json.load(sys.stdin)['runtimes'] if x['platform'] == 'iOS']
          print(r[-1] if r else '')")
            if [ -n "$TYPE" ] && [ -n "$RUNTIME" ]; then
              UDID=$(xcrun simctl create "$DEVICE" "$TYPE" "$RUNTIME")
            fi
          fi
          if [ -z "$UDID" ]; then
            echo "No simulator '$DEVICE' on this runner (Xcode $(xcodebuild -version | head -1)). Available:"
            xcrun simctl list devicetypes | grep -E 'iPhone|iPad'
            exit 1
          fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # The device language, so the wallet starts in it.
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "${LANG_CODE%%-*}"
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string "${LANG_CODE/-/_}"
          xcrun simctl shutdown "$UDID" && xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState discharging --batteryLevel 100 \
            --cellularBars 4 --wifiBars 3
          APP=$(find wallet/build/app -maxdepth 2 -name '*.app' | head -1)
          xcrun simctl install "$UDID" "$APP"
          # A foldable is shot unfolded, on its inner screen. simctl has no
          # command for the fold, so .github/tools/duo-hinge (vendored, MIT)
          # sends the hinge event the Device Hub app sends.
          case "$DEVICE" in *Duo*)
            clang -fobjc-arc -framework Foundation -o "$RUNNER_TEMP/duo-hinge" .github/tools/duo-hinge/duo-hinge.m
            "$RUNNER_TEMP/duo-hinge" -d "$UDID" flat
            sleep 5
            ;;
          esac
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Take the screenshots
        timeout-minutes: 30
        working-directory: wallet
        run: |
          mkdir -p shots && cd shots
          # A flow that fails still leaves the others' screenshots; a run that
          # produced none (the driver never started) is tried once more, and
          # fails the job if it still has none.
          for attempt in 1 2; do
            maestro --device "$UDID" test ../maestro/ --format junit --output ../maestro-report.xml || true
            ls *.png >/dev/null 2>&1 && break
            echo "No screenshots on attempt $attempt"
          done
          ls -la
          ls *.png >/dev/null 2>&1

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-ios-${{ matrix.device }}-${{ inputs.locale }}
          path: |
            wallet/shots/*.png
            wallet/maestro-report.xml
          if-no-files-found: ignore
          retention-days: 30

  android-build:
    if: inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The emulator's processor type alone (wallet/app.config.ts, buildArchs).
    env:
      WALLET_ANDROID_ABIS: x86_64
    steps:
      - uses: actions/checkout@v6

      # The demo APK as last built from exactly this wallet: a rerun, or a
      # change to the Maestro flows only, skips the build.
      - name: Reuse an unchanged build
        id: built
        uses: actions/cache@v6
        with:
          path: wallet/build/demo.apk
          key: demo-android-apk-${{ env.RATLS_VERSION }}-${{ hashFiles('wallet/**', '!wallet/maestro/**') }}

      - uses: oven-sh/setup-bun@v2
        if: steps.built.outputs.cache-hit != 'true'
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-java@v5
        if: steps.built.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: RA-TLS libraries
        if: steps.built.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wallet/modules/native-ratls/android/src/main/jniLibs
          cd wallet/modules/native-ratls/android/src/main/jniLibs
          gh release download "$RATLS_VERSION" --repo Privasys/ra-tls-clients \
            --pattern 'ratls-mobile-android.tar.gz' --output ratls-mobile-android.tar.gz
          tar -xzf ratls-mobile-android.tar.gz && rm ratls-mobile-android.tar.gz
          test -f x86_64/libratls_mobile.so

      - name: Stage artefacts for the EAS tarball
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          git add -f wallet/modules/native-ratls/android/src/main/jniLibs/
          git -c user.name='CI' -c user.email='ci@privasys.org' commit -m 'ci: add Rust Android artifacts [skip ci]'

      # Build caches, as in build-wallet: Gradle's downloads and build cache,
      # compiled C++ (ccache) and the packages, with EAS building in a fixed
      # folder so entries match.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.built.outputs.cache-hit != 'true'

      - name: Set up ccache and Gradle's build cache
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y -qq ccache
          # The user-level file wins over the project's, whose 2 GB heap ran
          # out packaging the APK on Ubuntu 26.04 runners (OutOfMemoryError in
          # :app:packageRelease). The runner has 16 GB.
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
          {
            echo "EAS_LOCAL_BUILD_WORKINGDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_BASEDIR=$RUNNER_TEMP/eas-build"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        if: steps.built.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.ccache
            ~/.bun/install/cache
          key: wallet-android-demo-${{ hashFiles('wallet/bun.lock') }}-${{ github.sha }}
          restore-keys: |
            wallet-android-demo-${{ hashFiles('wallet/bun.lock') }}-
            wallet-android-demo-

      - name: Install dependencies
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: wallet
        run: bun install --frozen-lockfile

      - uses: expo/expo-github-action@v9
        if: steps.built.outputs.cache-hit != 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build the demo APK
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: wallet
        run: |
          eas build --platform android --profile demo --local --non-interactive --output build/demo.apk
          ccache -s

      - uses: actions/upload-artifact@v7
        with:
          name: demo-android-apk
          path: wallet/build/demo.apk
          retention-days: 3

  android:
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.android_profiles) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: demo-android-apk
          path: wallet/build

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Take the screenshots
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disable-animations: true
          working-directory: wallet
          script: |
            adb install -r build/demo.apk
            adb shell settings put global sysui_demo_allowed 1
            adb shell am broadcast -a com.android.systemui.demo -e command enter
            adb shell am broadcast -a com.android.systemui.demo -e command clock -e hhmm 0941
            adb shell am broadcast -a com.android.systemui.demo -e command battery -e level 100 -e plugged false
            adb shell am broadcast -a com.android.systemui.demo -e command network -e wifi show -e level 4 -e mobile show -e datatype none -e level 4
            adb shell am broadcast -a com.android.systemui.demo -e command notifications -e visible false
            adb shell am broadcast -a com.android.systemui.demo -e command status -e location hide -e alarm hide -e sync hide -e bluetooth hide
            adb shell "setprop persist.sys.locale ${{ inputs.locale }}; setprop ctl.restart zygote" || true
            sleep 20
            if [ "${{ inputs.android_fold }}" = "folded" ]; then adb emu fold; sleep 10; adb shell wm size; fi
            mkdir -p shots && cd shots && (maestro test ../maestro/ --format junit --output ../maestro-report.xml || true) && ls -la

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-android-${{ matrix.profile }}-${{ inputs.android_fold }}-${{ inputs.locale }}
          path: |
            wallet/shots/*.png
            wallet/maestro-report.xml
          if-no-files-found: ignore
          retention-days: 30
