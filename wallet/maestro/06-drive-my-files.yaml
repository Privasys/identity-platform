appId: org.privasys.wallet.demo
name: Drive, My files
---
- runFlow: subflows/launch.yaml
# A wide window has Drive in its sidebar; a phone opens it from Profile.
- runFlow:
    when:
      visible:
        id: "tab-drive"
    commands:
      - tapOn:
          id: "tab-drive"
- runFlow:
    when:
      notVisible:
        id: "tab-drive"
    commands:
      - scrollUntilVisible:
          element:
            id: "profile-drive"
          direction: DOWN
          timeout: 30000
      - tapOn:
          id: "profile-drive"
- extendedWaitUntil:
    visible:
      id: "drive-item-f-documents"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 06-drive-my-files
