name: Build SDK

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'shared/canonical-attributes.json'
      - '.github/workflows/build-sdk.yaml'
  pull_request:
    paths:
      - 'sdk/**'
      - 'shared/canonical-attributes.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      # The SDK ships the canonical attribute list as its integration surface, so
      # it bundles a copy: an npm package cannot reach outside its own directory,
      # and a package that fetched the list at import time would be useless to a
      # picker that has to render before the network answers. `sync-shared` keeps
      # the copy current and this re-runs it, so a forgotten sync is a red build
      # rather than an SDK offering attributes the IdP has never heard of. The
      # IdP's own copy of this file went eleven attributes stale exactly that way.
      - name: Re-sync the shared referential
        working-directory: sdk
        run: npm run sync-shared

      - name: Fail if the bundled copy was stale
        run: git diff --exit-code -- sdk/src/shared

      - name: Type-check
        working-directory: sdk
        run: npx tsc --noEmit

      - name: Build ESM + declarations
        working-directory: sdk
        run: npx tsc

      - name: Build IIFE bundle
        working-directory: sdk
        run: npm run build:iife

      - name: Verify output
        working-directory: sdk
        run: |
          test -f dist/index.js || (echo "Missing dist/index.js" && exit 1)
          test -f dist/index.d.ts || (echo "Missing dist/index.d.ts" && exit 1)
          test -f dist/privasys-auth.iife.js || (echo "Missing IIFE bundle" && exit 1)
          echo "SDK build output:"
          ls -lh dist/
          echo ""
          echo "IIFE bundle size: $(wc -c < dist/privasys-auth.iife.js) bytes"

      - name: Upload IIFE bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: privasys-auth-iife
          path: |
            sdk/dist/privasys-auth.iife.js
            sdk/dist/privasys-auth.iife.js.map
          retention-days: 90
